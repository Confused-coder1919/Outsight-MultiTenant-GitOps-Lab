replicaCount: 1

image:
  # Defaults for a demo; overridden per tenant in charts/demo-api/tenants/.
  repository: ghcr.io/syedtashfin/outsight-multitenant-gitops-lab/demo-api
  tag: "dev"
  pullPolicy: IfNotPresent

service:
  # ClusterIP keeps traffic internal; port-forward for local access.
  type: ClusterIP
  port: 8000
  targetPort: 8000

# Used to stamp tenant identity into responses and metrics labels.
tenantName: "default"
# App name is stable across tenants; override only if you run multiple apps.
appName: "demo-api"
# Environment label to distinguish dev/stage/prod.
environment: "dev"

demoFailureEndpoint:
  # Keep disabled in normal runs; scripts enable it temporarily for canary failure demos.
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics
  labels:
    # Must match kube-prometheus-stack serviceMonitorSelector.
    release: kube-prometheus-stack

podDisruptionBudget:
  enabled: true
  minAvailable: 1

rollout:
  enabled: true
  revisionHistoryLimit: 3
  # Canary pauses (30s + 60s) and analysis windows can exceed 120s in real clusters.
  progressDeadlineSeconds: 420
  progressDeadlineAbort: true
  maxSurge: "25%"
  maxUnavailable: 0
  abortScaleDownDelaySeconds: 30
  # Step sequence for Argo Rollouts canary progression.
  steps:
    - setWeight: 10
      pauseSeconds: 30
      analysis: true
    - setWeight: 50
      pauseSeconds: 60
      analysis: true
    - setWeight: 100
  analysis:
    enabled: true
    interval: 30s
    count: 3
    failureLimit: 1
    # Threshold arguments injected into AnalysisTemplate queries.
    maxErrorRate: 0.02
    maxP95LatencyMs: 1200
    # Conditions evaluate normalized values where <= 1 is healthy.
    successCondition5xx: "result[0] <= 1"
    successConditionP95: "result[0] <= 1"
    failureCondition5xx: "result[0] > 1"
    failureConditionP95: "result[0] > 1"
    # Prometheus service from kube-prometheus-stack in the observability namespace.
    prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090

networkPolicy:
  enabled: true
  # Allow Prometheus in the observability namespace to scrape /metrics.
  allowIngressFromObservability: true
  # Set to true if the app must talk to observability services.
  allowEgressToObservability: false

rbac:
  tenantViewer:
    enabled: true
    serviceAccountName: tenant-viewer
    roleName: tenant-viewer
  argocd:
    enabled: true
    namespace: argocd
    serviceAccountName: argocd-application-controller
    clusterRole: edit

prometheusRule:
  enabled: true
  labels:
    release: kube-prometheus-stack
  rules:
    podRestarts:
      enabled: true
      threshold: 3
      window: 10m
      duration: 10m
      severity: warning
    highErrorRate:
      enabled: true
      threshold: 0.05
      window: 5m
      duration: 5m
      severity: warning
    highP95Latency:
      enabled: true
      thresholdSeconds: 0.8
      window: 5m
      duration: 5m
      severity: warning
    noTraffic:
      enabled: true
      window: 10m
      duration: 15m
      severity: warning
