apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "demo-api.fullname" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
    {{- include "demo-api.tenantLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  progressDeadlineAbort: {{ .Values.rollout.progressDeadlineAbort }}
  selector:
    matchLabels:
      {{- include "demo-api.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      maxSurge: {{ .Values.rollout.maxSurge | quote }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
      abortScaleDownDelaySeconds: {{ .Values.rollout.abortScaleDownDelaySeconds }}
      steps:
        {{- range $step := .Values.rollout.steps }}
        - setWeight: {{ $step.setWeight }}
        {{- if hasKey $step "pauseSeconds" }}
        - pause:
            duration: {{ $step.pauseSeconds }}s
        {{- end }}
        {{- if and $.Values.rollout.analysis.enabled ($step.analysis | default false) }}
        - analysis:
            templates:
              - templateName: {{ include "demo-api.fullname" $ }}-analysis
            args:
              - name: tenant
                value: "{{ $.Values.tenantName }}"
              - name: namespace
                value: "{{ $.Release.Namespace }}"
              - name: maxErrorRate
                value: {{ $.Values.rollout.analysis.maxErrorRate | quote }}
              - name: maxP95LatencyMs
                value: {{ $.Values.rollout.analysis.maxP95LatencyMs | quote }}
        {{- end }}
        {{- end }}
  template:
    metadata:
      labels:
        {{- include "demo-api.selectorLabels" . | nindent 8 }}
        {{- include "demo-api.tenantLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "demo-api.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Tenant name makes the same image behave differently per namespace.
            - name: TENANT_NAME
              value: "{{ .Values.tenantName }}"
            # App name is used to tag metrics for easier filtering.
            - name: APP_NAME
              value: "{{ .Values.appName }}"
            # Failure endpoint is enabled only during scripted canary-failure demos.
            - name: ENABLE_DEMO_FAILURE_ENDPOINT
              value: {{ ternary "true" "false" .Values.demoFailureEndpoint.enabled | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            # Health checks reduce noisy restarts during deployment updates.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # Readiness gates traffic so tenants only receive healthy pods.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
