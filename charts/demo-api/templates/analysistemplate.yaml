{{- if .Values.rollout.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "demo-api.fullname" . }}-analysis
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
    {{- include "demo-api.tenantLabels" . | nindent 4 }}
spec:
  args:
    - name: tenant
    - name: namespace
    - name: maxErrorRate
    - name: maxP95LatencyMs
  metrics:
    - name: error-rate-5xx
      # Query returns error_rate / maxErrorRate. <= 1 is healthy.
      # `or vector(0)` keeps no-traffic windows numeric instead of empty vectors.
      interval: {{ .Values.rollout.analysis.interval }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      successCondition: {{ .Values.rollout.analysis.successCondition5xx | quote }}
      failureCondition: {{ .Values.rollout.analysis.failureCondition5xx | quote }}
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress | quote }}
          query: |
            (
              (
                (sum(rate(http_requests_total{tenant="{{`{{args.tenant}}`}}",status=~"5.."}[2m])) or vector(0))
                /
                clamp_min(
                  (sum(rate(http_requests_total{tenant="{{`{{args.tenant}}`}}"}[2m])) or vector(0)),
                  1
                )
              )
              /
              clamp_min({{`{{args.maxErrorRate}}`}}, 0.000001)
            ) or vector(0)
    - name: latency-p95
      # Query returns p95_latency_ms / maxP95LatencyMs. <= 1 is healthy.
      # Missing histograms resolve to 0 so analysis does not fail on no-data.
      interval: {{ .Values.rollout.analysis.interval }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      successCondition: {{ .Values.rollout.analysis.successConditionP95 | quote }}
      failureCondition: {{ .Values.rollout.analysis.failureConditionP95 | quote }}
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress | quote }}
          query: |
            (
              (
                histogram_quantile(
                  0.95,
                  sum by (le) (
                    rate(http_request_duration_seconds_bucket{tenant="{{`{{args.tenant}}`}}"}[2m])
                  )
                )
                or vector(0)
              ) * 1000
              /
              clamp_min({{`{{args.maxP95LatencyMs}}`}}, 1)
            ) or vector(0)
{{- end }}
