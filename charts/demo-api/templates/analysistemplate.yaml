{{- if .Values.rollout.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "demo-api.fullname" . }}-analysis
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
    {{- include "demo-api.tenantLabels" . | nindent 4 }}
spec:
  args:
    - name: tenant
    - name: namespace
  metrics:
    - name: error-rate-5xx
      # 2% threshold for server errors during canary.
      interval: {{ .Values.rollout.analysis.interval }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      successCondition: {{ .Values.rollout.analysis.successCondition5xx | quote }}
      failureCondition: {{ .Values.rollout.analysis.failureCondition5xx | quote }}
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress | quote }}
          query: |
            # Force a numeric result even with no samples; no-traffic resolves to 0.
            (
              (
                sum(rate(http_requests_total{tenant="{{`{{args.tenant}}`}}",status=~"5.."}[2m]))
                or vector(0)
              )
              /
              clamp_min(
                (
                  sum(rate(http_requests_total{tenant="{{`{{args.tenant}}`}}"}[2m]))
                  or vector(0)
                ),
                1
              )
            ) or vector(0)
    - name: latency-p95
      # 500ms threshold for p95 request latency during canary.
      interval: {{ .Values.rollout.analysis.interval }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      successCondition: {{ .Values.rollout.analysis.successConditionP95 | quote }}
      failureCondition: {{ .Values.rollout.analysis.failureConditionP95 | quote }}
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress | quote }}
          query: |
            # Fallback to 0 when histogram buckets are absent so no-data does not crash analysis.
            (
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(http_request_duration_seconds_bucket{tenant="{{`{{args.tenant}}`}}"}[2m])
                )
              )
            ) or vector(0)
{{- end }}
