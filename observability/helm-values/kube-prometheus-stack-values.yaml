grafana:
  adminUser: admin
  adminPassword: admin
  service:
    # Expose Grafana on a stable demo URL from the VPS.
    type: NodePort
    nodePort: 30000

prometheus:
  service:
    # Expose Prometheus UI directly for recruiter demos.
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack
