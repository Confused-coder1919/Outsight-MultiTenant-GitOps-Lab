name: CI

on:
  pull_request:
    # Skip auto-promotion PRs (tenant values only) and docs-only changes.
    paths-ignore:
      - charts/demo-api/tenants/**
      - docs/**
      - assets/**
      - README.md
  push:
    branches:
      - main
    # Prevent recursive image-bump loops when the GitOps PR merges.
    paths-ignore:
      - charts/demo-api/tenants/**
      - docs/**
      - assets/**
      - README.md

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  IMAGE_REPO: ghcr.io/syedtashfin/outsight-multitenant-gitops-lab/demo-api
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          # Keep CI deterministic: requirements-dev.txt includes runtime deps.
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  build-publish-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message || '', 'chore(gitops): bump demo-api to sha-') }}"
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="sha-${SHORT_SHA}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}:main
            ${{ env.IMAGE_REPO }}:dev

      - name: Install yq
        run: |
          # /usr/local/bin is root-owned on GitHub hosted runners.
          sudo curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update tenant image values for Argo CD
        run: |
          yq -i '.image.repository = strenv(IMAGE_REPO) | .image.tag = strenv(IMAGE_TAG)' charts/demo-api/tenants/tenant-a-values.yaml
          yq -i '.image.repository = strenv(IMAGE_REPO) | .image.tag = strenv(IMAGE_TAG)' charts/demo-api/tenants/tenant-b-values.yaml

      - name: Detect GitOps value changes
        id: changes
        run: |
          if git diff --quiet -- charts/demo-api/tenants/tenant-a-values.yaml charts/demo-api/tenants/tenant-b-values.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open GitOps promotion PR
        id: gitops_pr
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          base: main
          branch: gitops/bump-image-${{ steps.meta.outputs.short_sha }}
          delete-branch: true
          commit-message: "chore(gitops): bump demo-api to ${{ steps.meta.outputs.image_tag }}"
          title: "chore(gitops): bump demo-api to ${{ steps.meta.outputs.image_tag }}"
          body: |
            ## Automated GitOps Promotion

            This PR updates the tenant Helm values to deploy the new immutable image:
            - `image.repository`: `${{ env.IMAGE_REPO }}`
            - `image.tag`: `${{ steps.meta.outputs.image_tag }}`

            ### Verify in Argo CD
            1. Open Argo CD and confirm `demo-api-tenant-a` and `demo-api-tenant-b` move to `OutOfSync` then `Synced/Healthy`.
            2. Check rollout status in both namespaces.

            ### Rollback
            Revert this PR (or set a previous `sha-*` tag in both tenant values) and Argo CD will roll back automatically.
          add-paths: |
            charts/demo-api/tenants/tenant-a-values.yaml
            charts/demo-api/tenants/tenant-b-values.yaml

      - name: Report GitOps promotion fallback
        if: steps.changes.outputs.changed == 'true' && steps.gitops_pr.outcome != 'success'
        run: |
          echo "::warning::Image build/push succeeded, but GitOps PR automation could not open a PR."
          echo "::warning::Most common cause: repository setting 'Allow GitHub Actions to create and approve pull requests' is disabled."
          echo "::warning::Manual fallback:"
          echo "  git checkout -b gitops/bump-image-${SHORT_SHA}"
          echo "  yq -i '.image.repository = strenv(IMAGE_REPO) | .image.tag = strenv(IMAGE_TAG)' charts/demo-api/tenants/tenant-a-values.yaml"
          echo "  yq -i '.image.repository = strenv(IMAGE_REPO) | .image.tag = strenv(IMAGE_TAG)' charts/demo-api/tenants/tenant-b-values.yaml"
          echo "  git commit -am 'chore(gitops): bump demo-api to ${IMAGE_TAG}'"
          echo "  git push origin gitops/bump-image-${SHORT_SHA}"

      - name: No-op when image tag is already promoted
        if: steps.changes.outputs.changed != 'true'
        run: echo "Tenant values already reference ${IMAGE_TAG}; no GitOps PR created."
